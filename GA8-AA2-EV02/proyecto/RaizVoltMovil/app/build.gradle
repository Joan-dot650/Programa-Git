plugins { id 'com.android.application' }
android {
 namespace 'com.jhontineo.raizvolt'
 compileSdk 35
 defaultConfig { applicationId 'com.jhontineo.raizvolt'; minSdk 23; targetSdk 35; versionCode 1; versionName '1.0'; testInstrumentationRunner 'com.jhontineo.raizvolt.AcceptanceRunner' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 buildTypes { release { minifyEnabled false } }
 lint { abortOnError true }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
