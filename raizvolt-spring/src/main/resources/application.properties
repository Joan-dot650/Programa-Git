# Aplicación local: las solicitudes de otros equipos no se aceptan por defecto.
spring.application.name=raizvolt-spring
server.address=127.0.0.1
server.port=${RAIZVOLT_PUERTO:8080}
server.servlet.context-path=/raizvolt
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# H2 en archivo: los datos sobreviven a los reinicios y no se suben a Git.
spring.datasource.url=jdbc:h2:file:./datos/raizvolt;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.thymeleaf.encoding=UTF-8
spring.web.resources.cache.period=0
